name: Engine
on:
  push:
    branches: [main, feat/parity-performance]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/VideoSpace.Tests -c Release
      - run: dotnet run --project tests/VideoSpace.Editing.Tests -c Release
